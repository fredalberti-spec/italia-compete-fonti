# Paid deployment: review price in Render before applying.
services:
  - type: worker
    name: italia-compete-fonti
    runtime: python
    region: frankfurt
    plan: starter
    numInstances: 1
    autoDeployTrigger: 'off'
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
   
    disk:
      name: session-and-ledger
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATA_DIR
        value: /var/data
      - key: INGESTION_ENABLED
        value: 'true'
      - key: START_FROM
        value: '2026-09-26T00:00:00+02:00'
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_NAMESPACE_ID
        value: '2166447024'
      - key: DROPBOX_BASE
        value: /Projects/Italia Compete/Gestione editoriale/Fonti Telegram
      - key: OFFCLASS_CHAT_TITLE
        value: Harvard business review
      - key: OFFCLASS_DROPBOX_BASE
        value: /Off Class/01 fonti originali/Telegram Harvard Business Review
      - key: OFFCLASS_DROPBOX_NAMESPACE_ID
        value: '13529493'
      - key: OFFCLASS_START_FROM
        value: '2026-09-26T00:00:00+02:00'
      - key: OFFCLASS_ENABLED
        value: 'true'
